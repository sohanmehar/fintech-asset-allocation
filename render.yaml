services:
  - type: web
    name: fintech-asset-allocation
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://fintech-asset-allocation.vercel.app
      - key: MARKET_DATA_PROVIDER
        value: seeded
